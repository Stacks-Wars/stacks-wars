[package]
name = "stacks_wars_game_ludo"
version = "0.1.0"
edition = "2024"

[dependencies]
stacks_wars_core = { path = "../../core" }
async-trait = "0.1"
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.9.1"
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
