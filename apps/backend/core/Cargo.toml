[package]
name = "stacks_wars_core"
version = "0.1.0"
edition = "2024"
description = "Traits and portable types for Stacks Wars game engine crates."
license-file = "LICENSE"
repository = "https://github.com/Stacks-Wars/stacks-wars"
readme = "README.md"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["serde_derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
